<section id="inicio" class="hero">
  <div class="hero__bg" aria-hidden="true"></div>

  <div class="wrap hero__content">
    <h1 class="hero__brand">AMD <em>Soluciones</em></h1>
    <p class="hero__legal">{{ 'brandSub' | localize }}</p>
    <p class="hero__promise">{{ 'heroPromise' | localize }}</p>
    <div class="hero__cta">
      <a class="btn btn--gold" routerLink="/" fragment="contacto">{{ 'heroCtaPrimary' | localize }}</a>
      <a class="btn btn--ghost" routerLink="/" fragment="servicios">{{ 'heroCtaSecondary' | localize }}</a>
    </div>
  </div>

  <div class="hero__scroll" aria-hidden="true">Scroll</div>
</section>
