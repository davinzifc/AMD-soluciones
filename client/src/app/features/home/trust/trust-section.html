<section id="confianza" class="trust section--light">
  <div class="wrap">
    <p class="eyebrow eyebrow--ink">{{ 'trustEyebrow' | localize }}</p>

    @for (quote of testimonials; track quote.textKey; let i = $index) {
      <figure class="quote" [class.is-active]="isActive(i)" [attr.hidden]="isActive(i) ? null : ''">
        <blockquote data-quote>
          <p>{{ quote.textKey | localize }}</p>
        </blockquote>
        <figcaption>— {{ quote.byKey | localize }}</figcaption>
      </figure>
    }

    <div class="quote__dots" role="tablist" [attr.aria-label]="'testimonialDotsAria' | localize">
      @for (quote of testimonials; track quote.textKey; let i = $index) {
        <button
          type="button"
          role="tab"
          [attr.aria-label]="testimonialLabel(i)"
          [attr.aria-selected]="isActive(i)"
          [attr.aria-current]="isActive(i)"
          (click)="selectTestimonial(i)"
        ></button>
      }
    </div>

    <app-client-wall />

    <div class="ticker" aria-hidden="true">
      <div class="ticker__track" data-ticker [class.is-reduced-motion]="reducedMotion()">
        @for (sectorKey of sectors; track $index) {
          <span>{{ sectorKey | localize }}</span>
        }
      </div>
    </div>

    <p class="ticker__label">{{ 'tickerLabel' | localize }}</p>
  </div>
</section>
