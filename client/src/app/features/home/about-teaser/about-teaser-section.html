<section id="sobre-amd" class="about-teaser section--light">
  <div class="wrap about-grid">
    <figure class="about-visual">
      <img
        src="media/about-asesoria.webp"
        [alt]="'aboutFigureAlt' | localize"
        loading="lazy"
        decoding="async"
        width="1600"
        height="1067"
      />
      <figcaption>{{ 'aboutFigureCaption' | localize }}</figcaption>
    </figure>

    <div class="about-copy">
      <h2>{{ 'aboutTitle' | localize }}</h2>
      <p>{{ 'aboutBody' | localize }}</p>

      <div class="about-actions">
        <a class="btn btn--gold" routerLink="/about-us">{{ 'seeMore' | localize }}</a>
        <a class="btn btn--ghost" routerLink="/" fragment="contacto">{{ 'aboutCta' | localize }}</a>
      </div>
    </div>
  </div>
</section>
