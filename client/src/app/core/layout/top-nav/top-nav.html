<header class="topnav">
  <div class="wrap topnav__inner">
    <a class="brand" routerLink="/" aria-label="AMD Soluciones Integrales">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__text">AMD Soluciones<span>{{ 'brandSub' | localize }}</span></span>
    </a>

    <nav aria-label="Sitio">
      <ul class="topnav__links">
        <li>
          <a
            routerLink="/"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            >{{ 'navHome' | localize }}</a
          >
        </li>
        <li>
          <a routerLink="/quienes-somos" routerLinkActive="is-active" ariaCurrentWhenActive="page">{{
            'navAboutPage' | localize
          }}</a>
        </li>
        <li>
          <a routerLink="/servicios" routerLinkActive="is-active" ariaCurrentWhenActive="page">{{
            'navServicesPage' | localize
          }}</a>
        </li>
      </ul>
    </nav>

    <div class="topnav__actions">
      <div class="lang" role="group" [attr.aria-label]="'langAria' | localize">
        <button type="button" [attr.aria-pressed]="locale.locale() === 'es'" (click)="setLocale('es')">ES</button>
        <button type="button" [attr.aria-pressed]="locale.locale() === 'en'" (click)="setLocale('en')">EN</button>
      </div>

      <a class="btn btn--gold" routerLink="/" fragment="contacto">{{ 'navCta' | localize }}</a>

      <button
        #menuBtn
        class="menu-btn"
        type="button"
        [attr.aria-expanded]="drawerState.isOpen()"
        aria-controls="drawer"
        [attr.aria-label]="'menuAria' | localize"
        (click)="toggleDrawer()"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
    </div>
  </div>
</header>
